[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "somospie-gfm"
version = "0.1.0"
description = "Prithvi-based soil-moisture downscaling workflows"
requires-python = ">=3.10,<3.13"
dependencies = [
  "geopandas>=1.0,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "shapely>=2,<3",
  "terratorch==1.2.11",
  "torch==2.9.1",
  "torchvision==0.24.1",
]

[project.scripts]
somospie-gfm-train = "somospie_gfm.nn.train:main"
somospie-gfm-infer = "somospie_gfm.nn.infer:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["somospie_gfm*"]
namespaces = true
